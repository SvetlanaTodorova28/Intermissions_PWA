<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Intermissions</title>
    <base href="/Intermissions_PWA/" />
    <link rel="stylesheet" href="css/bootstrap/bootstrap.min.css" />
    <link rel="stylesheet" href="css/app.css" />
    <link rel="icon" type="image/png" href="favicon.ico" />
    <link href="IntermissionsPwaApp.styles.css" rel="stylesheet" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="apple-touch-icon" sizes="512x512" href="icon-512.png" />
    <link rel="apple-touch-icon" sizes="192x192" href="icon-192.png" />
    

</head>
<body>
<div id="app">
    <svg class="loading-progress">
        <circle r="40%" cx="50%" cy="50%" />
        <circle r="40%" cx="50%" cy="50%" />
    </svg>
    <div class="loading-progress-text"></div>
</div>

<div id="blazor-error-ui">
    Er is een fout opgetreden.
    <a href="" class="reload">Herlaad</a>
    <a class="dismiss">🗙</a>
</div>
<script>
    if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('service-worker.js')
            .then(registration => {
                console.log(`✅ Service Worker geregistreerd`, registration.scope);
            })
            .catch(error => {
                console.error(`❌ Fout bij registratie van Service Worker:`, error);
            });
    }
</script>

<script>
    let deferredPrompt;

    window.addEventListener('beforeinstallprompt', (e) => {
        console.log("🟡 beforeinstallprompt fired");
        e.preventDefault();
        deferredPrompt = e;
        window.dispatchEvent(new Event("installPromptAvailable"));
    });


    window.showInstallPrompt = async () => {
        if (deferredPrompt) {
            deferredPrompt.prompt();
            const result = await deferredPrompt.userChoice;
            deferredPrompt = null;
            return result.outcome === 'accepted';
        }
        return false;
    };

    window.installPromptIsAvailable = () => {
        return !!deferredPrompt;
    };
</script>
<script>
    window.badgeHelper = {
        setBadge: function (count) {
            if ('setAppBadge' in navigator) {
                navigator.setAppBadge(count);
            }
        },
        clearBadge: function () {
            if ('clearAppBadge' in navigator) {
                navigator.clearAppBadge();
            }
        }
    };
</script>
<script>
    window.onload = () => {
        if ('setAppBadge' in navigator) {
            navigator.setAppBadge(1);
            console.log("✅ Badge gezet!");
        } else {
            console.warn("❌ Badging API niet ondersteund op dit platform.");
        }
    };
</script>

<script src="_framework/blazor.webassembly.js"></script>
</body>
</html>
